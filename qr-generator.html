<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buat QR Kado Caca</title>
<style>body{font-family:system-ui;max-width:600px;margin:50px auto;padding:20px;text-align:center}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0 15px;box-sizing:border-box}button{padding:13px 20px;border:0;border-radius:99px;background:#ff6f9d;color:white;font-weight:700}#qr{margin:25px auto}</style>
<h1>QR Kado Caca 💗</h1>
<p>Tempel URL website yang sudah online:</p>
<input id="url" placeholder="https://...">
<button onclick="makeQR()">Buat QR Code</button>
<div id="qr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function makeQR(){
 const u=document.getElementById('url').value.trim();
 if(!u)return alert('Masukkan URL dulu.');
 document.getElementById('qr').innerHTML='';
 new QRCode(document.getElementById('qr'),{text:u,width:260,height:260});
}
</script>
